name: Laya image

# Builds docker/laya and pushes it to ghcr.io/sasin91/recruiter-laya, tagged
# with the laya version and the commit. The Trongate.cloud service "laya"
# runs the version tag.
on:
  push:
    branches: [master]
    paths: ['docker/laya/**', '.github/workflows/laya-image.yml']
  pull_request:
    paths: ['docker/laya/**', '.github/workflows/laya-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/recruiter-laya
  LAYA_VERSION: 0.4.0

jobs:
  image:
    name: Build (and on master, push) the Laya image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/laya
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.LAYA_VERSION }}
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
