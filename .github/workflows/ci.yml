name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: make lint
        run: make lint

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, sodium
          coverage: none
      - name: composer install (dompdf for the cv_match PDF test)
        run: composer install --no-dev --no-interaction --no-progress
      - name: make test
        run: make test

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make shellcheck
        run: make shellcheck

  sql:
    name: Schema applies cleanly
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.2
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: make schema (applies db/schema.sql twice to a database not named recruiter, as on Trongate.cloud)
        run: make schema MYSQL="mysql -h127.0.0.1 -uroot -proot" DB=tc_p1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: make test-db (the tests that need MariaDB, e.g. the queue's database tests)
        run: make test-db MYSQL="mysql -h127.0.0.1 -uroot -proot" DB_PASSWORD=root
